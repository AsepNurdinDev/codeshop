syntax = "proto3";

// Internal gRPC contract for the Auth Service.
//
// Per docs/architecture/SERVICE_CATALOG.md §2, the Auth Service exposes:
//   - gRPC internal API: ValidateToken, GetUser
//     consumed by: API Gateway, Order Service, Download Service.
//
// Per docs/decisions/ADR-003-grpc-internal-communication.md, all internal
// service-to-service communication uses gRPC with strongly-typed contracts.
package codeshop.auth.v1;

option go_package = "github.com/codeshop-platform/auth-service/pkg/pb;pb";

service AuthService {
  // ValidateToken verifies a JWT access token's signature and expiry and
  // returns the identity encoded in it. Intended to be stateless (no DB
  // round-trip) so that Auth Service downtime does not block other
  // services from validating already-issued tokens
  // (see ARCHITECTURE.md §12 Failure Scenarios).
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // GetUser returns public user identity information by user ID.
  // Used by other services that only hold a user_id reference
  // (cross-service reference by ID, see DATABASE_DESIGN.md §8).
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  string role = 4;
  // reason is populated when valid == false (e.g. "expired", "invalid_signature").
  string reason = 5;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string email = 2;
  string full_name = 3;
  string role = 4;
  string status = 5;
}
